# Production overrides for selfservice helm chart.
# Apply with: helm upgrade selfservice . -n selfservice -f values.yaml -f values.prod.yaml
#
# This file is the production source of truth. It must match the live Helm
# intent (admission, claims, hosts, synthetic suspend). Do not leave a newer
# contract only on the cluster or in /tmp overlays.
#
# Note: deploy.sh validate_foundation_intent still requires a contained
# candidate (PROVISIONING_ENABLED=false). A guarded deploy.sh apply of this
# overlay will fail until that gate is retargeted. Until then, production
# applies of this file use helm with the digest post-renderer from git, not
# host-local script copies.
#
# Anything NOT listed here uses defaults from values.yaml. Keep this file as
# small as possible — only true production overrides belong here.
#
# Secrets are NOT in this file. They are managed via External Secrets Operator
# pulling from Vault. See:
#   - SecretStore: kubectl get secretstore -n selfservice vault-backend
#   - ExternalSecrets: kubectl get externalsecret -n selfservice
#   - Vault path: secret/selfservice/<secret-name>

replicaCount:
  # One worker is enough while AMD canaries stay serial (one host in VCENTER_HOSTS).
  worker: 1

provisioning:
  # Live Helm 176 (2026-09-01): API admission and worker claims are open.
  # Mutating synthetics stay off until each AMD host has a zero-residue noop canary.
  enabled: true
  workerClaimsEnabled: true

vcenter:
  # Exact-host pin: ESXi1 only. Helm 178 ESXi2-only canary failed at placement
  # planning because synthetic-noop (vm-8002) lives on host-1002/ESXi1, which
  # must be in the allowlist to clone. No guest VM was created. Do not pin
  # ESXi2-only until templates are on that host or both hosts are allowlisted.
  hosts: "esxi1.lab.jmal.io"
  resourcePools: "/JMAL-Datacenter/host/AMD-Cluster/Resources/Student-VMs"
  placementReservedMemoryMB: "esxi1.lab.jmal.io=8192"
  # k3sv01 validates the vCenter 8.0.3 certificate through the system trust
  # chain. Keep hostname verification enabled in every production process.
  insecure: "false"

# Synthetic monitoring keeps the non-mutating API monitor active while the
# lifecycle check stays disabled and the runner/janitor CronJobs stay
# rendered but suspended. deploy.sh still contains rollback safety by
# forcing clone-producing CronJobs off before a guarded apply and after a
# failed atomic rollback.
synthetic:
  # Non-mutating API monitor is scheduled. Lifecycle/runner/janitor stay
  # rendered but suspended until AMD canaries pass.
  suspend: false
  schedule: "*/12 * * * *"
  provisioningExpectedEnabled: true
  lifecycle:
    enabled: false
    template: synthetic-noop
    # Pinned to the production-calibrated value. Must agree with
    # values.yaml and DefaultPodLifecycleConfig in lifecycle.go.
    # Worst case: 2×(150s+90s+60s)+30s = 630s = 10m30s.
    # The pinned */12 schedule leaves 90s before the next run.
    readyTimeout: 150s
    destroyTimeout: 90s
    maxAttempts: 2
    retryBackoff: 30s
  janitor:
    enabled: true
    suspend: true
  # Hourly end-to-end proof of the Kali runner path (Multus NAD, CNI dhcp lease,
  # pod-VLAN L3 reachability, nmap). Chart defaults already match prod: it clones
  # the synthetic-noop template and runs the version-controlled playlist seeded by
  # deploy/sql/synthetic-runner-smoke-playlist.sql.
  runner:
    enabled: true
    suspend: true
    schedule: "37 * * * *"
    # Explicitly pin the deadline. The Runner-authorized retry cycle is
    # 2490s = 41m30s and its bounded session JWT TTL is 46m;
    # 2700s (45 min) gives 270s margin and fits the hourly schedule.
    activeDeadlineSeconds: 2700
    scheduleInterval: "1h"
    terminationGracePeriodSeconds: 60

# Template health checks (roadmap J-2) remain disabled during the initial
# reopening. When enabled later, structural checks and the rotating deep
# clone-boot-destroy check are leader-gated. A first deep failure schedules a
# separate durable confirmation, so a transient NFS blip cannot page confirmed
# health.
worker:
  contentFilter:
    # Foundation deployments must remain read-only. The deploy script also
    # validates these exact values in the final server-defaulted manifest.
    enabled: false
    categoryFeedBaseURL: ""
  # Poll persisted credential-validation due state every 5m. Any active
  # clone_with_customize template older than seven days is enqueued immediately
  # after startup or leader failover.
  l1Validation:
    enabled: true
    validationInterval: "168h"
    schedulerInterval: "5m"
  templateHealth:
    enabled: false
    interval: "12h"
    deepTimeout: "10m"
    confirmationBackoff: "5m"
    confirmationReconcileInterval: "1m"
  orphanReconciler:
    enabled: false
  networkReconciler:
    enabled: false
  idleEvaluator:
    enabled: false
    dryRun: true
  pipelineReconciler:
    enabled: false

# Bitnami postgresql subchart image overrides.
# We pin tag explicitly to avoid surprise major upgrades on chart upgrade.
postgresql:
  image:
    pullPolicy: IfNotPresent
    tag: latest
