# Production overrides for selfservice helm chart.
# Apply with: helm upgrade selfservice . -n selfservice -f values.yaml -f values.prod.yaml
#
# Anything NOT listed here uses defaults from values.yaml. Keep this file as
# small as possible — only true production overrides belong here.
#
# Secrets are NOT in this file. They are managed via External Secrets Operator
# pulling from Vault. See:
#   - SecretStore: kubectl get secretstore -n selfservice vault-backend
#   - ExternalSecrets: kubectl get externalsecret -n selfservice
#   - Vault path: secret/selfservice/<secret-name>

replicaCount:
  # Keep a single worker while the recovery containment stays in force.
  worker: 1

provisioning:
  # Durable emergency containment.
  enabled: false
  workerClaimsEnabled: false

vcenter:
  # Quarantine the ESXi hosts and admit only the validated Intel hosts.
  hosts: "nuc2.lab.jmal.io,nuc3.lab.jmal.io"
  resourcePools: "/JMAL-Datacenter/host/Intel-Cluster/Resources/Student-VMs"
  placementReservedMemoryMB: "nuc2.lab.jmal.io=2048,nuc3.lab.jmal.io=2048"
  # k3sv01 validates the vCenter 8.0.3 certificate through the system trust
  # chain. Keep hostname verification enabled in every production process.
  insecure: "false"

# Synthetic monitoring includes the non-mutating API monitor plus the
# clone-producing lifecycle, janitor, and runner checks. deploy.sh still
# contains rollback safety by forcing clone-producing CronJobs off before a
# guarded apply and after a failed atomic rollback.
synthetic:
  # Keep the non-mutating API monitor active. Destructive lifecycle coverage
  # remains independently gated below.
  suspend: false
  schedule: "*/12 * * * *"
  provisioningExpectedEnabled: false
  lifecycle:
    enabled: false
    template: synthetic-noop
    # Pinned to the production-calibrated value. Must agree with
    # values.yaml and DefaultPodLifecycleConfig in lifecycle.go.
    # Worst case: 2×(150s+90s+60s)+30s = 630s = 10m30s.
    # The pinned */12 schedule leaves 90s before the next run.
    readyTimeout: 150s
    destroyTimeout: 90s
    maxAttempts: 2
    retryBackoff: 30s
  janitor:
    enabled: true
    suspend: true
  # Hourly end-to-end proof of the Kali runner path (Multus NAD, CNI dhcp lease,
  # pod-VLAN L3 reachability, nmap). Chart defaults already match prod: it clones
  # the synthetic-noop template and runs the version-controlled playlist seeded by
  # deploy/sql/synthetic-runner-smoke-playlist.sql.
  runner:
    enabled: true
    suspend: true
    schedule: "37 * * * *"
    # Explicitly pin the deadline. The Runner-authorized retry cycle is
    # 2490s = 41m30s and its bounded session JWT TTL is 46m;
    # 2700s (45 min) gives 270s margin and fits the hourly schedule.
    activeDeadlineSeconds: 2700
    scheduleInterval: "1h"
    terminationGracePeriodSeconds: 60

# Template health checks (roadmap J-2) remain disabled during the initial
# reopening. When enabled later, structural checks and the rotating deep
# clone-boot-destroy check are leader-gated. A first deep failure schedules a
# separate durable confirmation, so a transient NFS blip cannot page confirmed
# health.
worker:
  contentFilter:
    # Foundation deployments must remain read-only. The deploy script also
    # validates these exact values in the final server-defaulted manifest.
    enabled: false
    categoryFeedBaseURL: ""
  # Poll persisted credential-validation due state every 5m. Any active
  # clone_with_customize template older than seven days is enqueued immediately
  # after startup or leader failover.
  l1Validation:
    enabled: true
    validationInterval: "168h"
    schedulerInterval: "5m"
  templateHealth:
    enabled: false
    interval: "12h"
    deepTimeout: "10m"
    confirmationBackoff: "5m"
    confirmationReconcileInterval: "1m"
  orphanReconciler:
    enabled: false
  networkReconciler:
    enabled: false
  idleEvaluator:
    enabled: false
    dryRun: true
  pipelineReconciler:
    enabled: false

# Bitnami postgresql subchart image overrides.
# We pin tag explicitly to avoid surprise major upgrades on chart upgrade.
postgresql:
  image:
    pullPolicy: IfNotPresent
    tag: latest
