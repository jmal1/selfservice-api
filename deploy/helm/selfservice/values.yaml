# Default values for selfservice portal
# Secrets come from K8s secrets (Vault integration deferred)

replicaCount:
  api: 1
  worker: 1
  engine: 1

image:
  api: ghcr.io/jmal1/selfservice-api-gateway
  worker: ghcr.io/jmal1/selfservice-provision-worker
  engine: ghcr.io/jmal1/selfservice-crucible-engine
  ui: ghcr.io/jmal1/selfservice-ui
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-pull-secret

api:
  port: 8080
  allowedOrigins: "https://crucible.jmal.io"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  # Pushgateway endpoint for the DestroyFailedPusher (drives the
  # CruciblePodsStuckInDestroyFailed Prometheus alert). Set to empty
  # string to disable cleanly. Job label is the Pushgateway grouping key.
  pushgatewayURL: "http://pushgateway.observability:9091"
  pushgatewayJob: "crucible_provision_worker"
  # vCenter orphan reconciler (Phase 2.3 of the 2026-06-10 esxi2 NFS41 APD
  # recovery). When enabled, the worker scans `orphanReconciler.folder` on
  # `orphanReconciler.interval` and:
  #   - auto-destroys any VM whose linked pod name starts with the synthetic
  #     prefix AND whose pod is in a terminal state for >= minAge,
  #   - logs + counts everything else (non-synthetic terminal pods, VMs with
  #     no pod_vms row at all) via crucible_vcenter_orphans_* metrics so the
  #     operator can review before any destructive action.
  # Disabled by default; opt in with enabled: true after observing the
  # dry-run metric counts for at least one tick.
  orphanReconciler:
    enabled: false
    # Empty falls back to vcenter.vmFolder (the prod default Student-VMs).
    folder: ""
    interval: "1h"
    minAge: "1h"
  # OPNsense + vlan_pool network reconciler. Converges VLAN/interface/DHCP
  # state for non-terminal pods and releases vlan_pool allocations for
  # terminal pods.
  networkReconciler:
    enabled: true
    interval: "5m"
  # Image-upload reconciler: refreshes crucible_image_uploads_stuck and
  # crucible_template_stuck by scanning for rows wedged in a non-terminal
  # state past staleThreshold. Feeds the CrucibleImageUploadStuck and
  # CrucibleTemplateStuck alerts.
  pipelineReconciler:
    enabled: true
    interval: "5m"
    staleThreshold: "2h"
  # Pushgateway job for the template/image pipeline metric families
  # (crucible_image_*, crucible_template_*). Separate job label from
  # pushgatewayJob above so the two metric sets can be scoped
  # independently in alert rules.
  pipelinePushgatewayJob: "crucible_pipeline"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

# OIDC Configuration (non-secret values)
oidc:
  issuerURL: "https://authentik.jmal.io/application/o/selfservice/"
  redirectURL: "https://crucible.jmal.io/auth/callback"

# K8s secret names
secrets:
  db: selfservice-db-creds
  jwt: selfservice-jwt-secret
  oidc: selfservice-oidc
  vcenter: selfservice-vcenter-creds
  opnsense: selfservice-opnsense-creds
  # Scoped MinIO service account for image uploads. Keys: access-key,
  # secret-key. Sourced from Vault at secret/crucible/minio — this is
  # deliberately NOT the MinIO root credential, and its policy is bound
  # to the crucible/* prefix of the bucket below.
  objectstore: selfservice-objectstore-creds

# Object storage (MinIO on stagingv01) used to stage browser uploads of
# installer ISOs and OVAs before a worker job imports them into vCenter.
#
# endpoint MUST be https: the Crucible UI is served over TLS, so a
# plain-http presigned PUT is blocked by the browser as mixed content.
# K3s Traefik + cert-manager (ClusterIssuer letsencrypt-prod, DNS-01 via Azure
# DNS) terminate TLS for s3.lab.jmal.io, mirroring grafana.lab.jmal.io. This is
# internal only: the A record lives solely in the lab BIND zone and resolves to
# the Traefik VIP, never to MinIO directly.
objectstore:
  enabled: true
  endpoint: "https://s3.lab.jmal.io"
  # The bucket is "isos"; Crucible namespaces its objects under the "crucible/"
  # prefix below, which is also the boundary the service-account policy enforces.
  bucket: "isos"
  prefix: "crucible"
  useSSL: true
  # Lifetime of a presigned upload URL. Short by design: a leaked URL is
  # a write primitive into the bucket.
  presignTTL: "15m"
  # Per-file upload cap. MinIO's data dir is on stagingv01's ROOT
  # filesystem (~85 GB free, no dedicated volume) and shares it with
  # apt-cacher-ng, which every Linux template build depends on. Do not
  # raise this without giving MinIO its own volume first (P0-4).
  maxUploadSize: "16Gi"
  # Refuse new uploads that would leave less than this much free on the
  # MinIO host, rather than discovering it partway through a multi-GB PUT.
  minFreeSpace: "20Gi"
  multipartPartSize: "64Mi"

# vCenter configuration (non-secret values; credentials from K8s secret)
vcenter:
  datacenter: JMAL-Datacenter
  datastore: NAS-vmstore
  vmFolder: Student-VMs
  resourcePools: "/JMAL-Datacenter/host/Intel-Cluster/Resources/Student-VMs,/JMAL-Datacenter/host/AMD-Cluster/Resources/Student-VMs"
  hosts: "esxi1.lab.jmal.io,esxi2.lab.jmal.io,nuc1.lab.jmal.io,nuc2.lab.jmal.io,nuc3.lab.jmal.io"
  insecure: "true"
  # Inventory path to the vCenter folder that houses source/base template VMs.
  # Drives the wizard's "Source vCenter VM" dropdown (folder enumeration via
  # /api/v1/admin/vcenter/templates-folder). Empty disables the endpoint.
  # NOTE: vCenter inventory paths are CASE-SENSITIVE — match the actual
  # folder name exactly (lowercase "templates" in this lab).
  templatesFolder: "/JMAL-Datacenter/vm/templates"
  # Datastore that holds installer ISOs and OVAs uploaded through
  # /admin/images, and the folder within it. Separate from
  # `datastore` (which holds running VM disks) because ISOs live on
  # the big NFS backup share.
  #
  # CASE-SENSITIVE and easy to get wrong: the real name ends in a
  # capital "S" — NAS-BackupsAndISOS, not ...ISOs. Phase 0 finding P0-5
  # caught this; the vault docs had it wrong.
  isoDatastore: "NAS-BackupsAndISOS"
  isoFolder: "ISOs"
  # vCenter credentials health probe (OP-1). Set healthPushgatewayURL to the
  # Pushgateway endpoint and the api-gateway will perform a fresh login
  # every healthInterval, pushing vsphere_login_success{user=...}. Catches
  # rotated SSO passwords that would otherwise be masked by cached sessions
  # for weeks (the failure mode that triggered this probe on 2026-06-07).
  healthPushgatewayURL: "http://pushgateway.observability:9091"
  healthInterval: "5m"

# OPNsense configuration (non-secret values; credentials from K8s secret)
opnsense:
  sshHost: "10.10.10.60:22"
  sshUser: root

# Database connection (non-secret values; password from K8s secret)
database:
  host: selfservice-postgresql
  port: 5432
  name: selfservice
  user: selfservice
  sslmode: disable

# NATS connection
natsURL: "nats://selfservice-nats:4222"

# Crucible Engine (assessment runner provisioner)
engine:
  port: 8081
  runnerImage: "ghcr.io/jmal1/selfservice-crucible-runner:latest"
  runnerNode: "k3sv03"
  trunkNIC: "ens224"
  # Hard kill for a runner Job, in seconds. Raised from the original 600
  # to accommodate the Kali base image: a cold pull of a ~2-3 GB image on
  # k3sv03's first run can consume most of a 10-minute budget before the
  # workflow even starts. CrucibleRunnerProvisionSlow alerts well before
  # this trips. See internal/engine/k8s.go.
  runnerActiveDeadlineSeconds: 900
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Synthetic API Monitor (customer-emulating runner; see internal/synthetic)
# Deploys a K8s CronJob that exercises live API routes as a real user and
# pushes results to Pushgateway → Prometheus → Grafana alerts.
synthetic:
  enabled: true
  image: ghcr.io/jmal1/selfservice-synthetic-api-monitor
  imageTag: ""  # defaults to .Values.image.tag
  schedule: "*/10 * * * *"
  baseURL: "https://crucible.jmal.io"
  pushgatewayURL: "http://pushgateway.observability:9091"
  job: "crucible_synthetic_api"
  layer: "api"
  username: "synthetic"
  role: "student"
  checkTimeout: "30s"
  # Name of the K8s Secret holding the synthetic user's DB user-id. The
  # secret MUST contain key `user-id` whose value is the UUID of the
  # synthetic user row in the users table. Bootstrap via the SQL in
  # deploy/sql/synthetic-user.sql.
  secretName: selfservice-synthetic-user
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Optional pod_lifecycle check (creates+destroys a real pod every cycle).
  # Disabled by default; enable only after the named template exists.
  lifecycle:
    enabled: false
    template: "synthetic-noop"
    readyTimeout: "8m"
    destroyTimeout: "90s"
    # activeDeadlineSeconds for the CronJob pod when lifecycle is enabled.
    # Must exceed readyTimeout + destroyTimeout + per-check overhead. 900s
    # (15 min) gives ~3 min headroom on top of the default 11m envelope.
    activeDeadlineSeconds: 900
  # Standalone orphan-pod janitor (defense-in-depth for synthetic monitoring).
  # Runs independently of the */10 monitor so synthetic pods don't accumulate
  # even if pod_lifecycle is broken or paused. The check name is
  # `synthetic_janitor`; severity is warning. See checks/janitor.go.
  janitor:
    enabled: false
    # Daily at 04:17 UTC — offset to avoid colliding with backup or monitor cron.
    schedule: "17 4 * * *"
    # Orphan-age cutoff. Pods named synthetic-noop-* and older than this are
    # destroyed. 1h is conservative given lifecycle runs complete in <5min.
    maxAge: "1h"
    # 10 minutes is plenty for listing pods + a handful of DELETEs.
    activeDeadlineSeconds: 600
    # Per-check timeout — janitor only does one list + N deletes, but DELETE
    # is async (returns 202) so we don't poll; 2 minutes is generous.
    checkTimeout: "120s"
    # Distinct Pushgateway layer label keeps janitor results separate from
    # the regular */10 monitor in dashboards and alerts.
    layer: "janitor"

# Vault sidecar annotations (disabled for now)
vault:
  enabled: false
  role: selfservice
  secretPaths:
    oidc: "selfservice/data/oidc"
    database: "selfservice/data/db"
    jwt: "selfservice/data/jwt"

# Traefik IngressRoute
ingress:
  enabled: true
  hostname: crucible.jmal.io

# PostgreSQL subchart values
postgresql:
  enabled: true
  auth:
    database: selfservice
    username: selfservice
    existingSecret: selfservice-db-creds
  primary:
    persistence:
      enabled: true
      storageClass: nfs-client
      size: 10Gi

# NATS subchart values
nats:
  enabled: true
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          enabled: true
          storageClassName: nfs-client
          size: 5Gi
