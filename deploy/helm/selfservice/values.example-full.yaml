# Example full-fleet overlay (placeholder topology only).
# Differs from values.example.yaml mainly by worker replica count.
# Real fleet topology lives in private crucible-deploy.

replicaCount:
  worker: 4

provisioning:
  enabled: true
  workerClaimsEnabled: true

vcenter:
  hosts: "esxi1.example.test,esxi2.example.test,host3.example.test,host4.example.test,host5.example.test"
  resourcePools: "/Example-Datacenter/host/AMD-Cluster/Resources/Student-VMs,/Example-Datacenter/host/Intel-Cluster/Resources/Student-VMs"
  placementReservedMemoryMB: "esxi1.example.test=8192,esxi2.example.test=8192,host3.example.test=4096,host4.example.test=2048,host5.example.test=2048"
  insecure: "false"

synthetic:
  provisioningExpectedEnabled: true
  lifecycle:
    enabled: true
  janitor:
    enabled: true
    suspend: false
  runner:
    enabled: true
    suspend: false

worker:
  pipelineReconciler:
    enabled: true
  l1Validation:
    enabled: true
  templateHealth:
    enabled: true
  orphanReconciler:
    enabled: true
  templateOrphanReconciler:
    enabled: true
  networkReconciler:
    enabled: true
  idleEvaluator:
    enabled: true
    dryRun: false
  contentFilter:
    enabled: false
