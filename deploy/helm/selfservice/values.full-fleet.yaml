# Apply only after every host-specific readiness gate has passed. This overlay
# describes the final fleet state without weakening the safe production rollout
# boundary in values.prod.yaml.

replicaCount:
  worker: 4

provisioning:
  enabled: true
  workerClaimsEnabled: true

vcenter:
  hosts: "esxi1.lab.jmal.io,esxi2.lab.jmal.io,nuc1.lab.jmal.io,nuc2.lab.jmal.io,nuc3.lab.jmal.io"
  resourcePools: "/JMAL-Datacenter/host/AMD-Cluster/Resources/Student-VMs,/JMAL-Datacenter/host/Intel-Cluster/Resources/Student-VMs"
  placementReservedMemoryMB: "esxi1.lab.jmal.io=8192,esxi2.lab.jmal.io=8192,nuc1.lab.jmal.io=4096,nuc2.lab.jmal.io=2048,nuc3.lab.jmal.io=2048"
  insecure: "false"

synthetic:
  provisioningExpectedEnabled: true
  lifecycle:
    enabled: true
  janitor:
    enabled: true
  runner:
    enabled: true

worker:
  pipelineReconciler:
    enabled: true
  l1Validation:
    enabled: true
  templateHealth:
    enabled: true
  orphanReconciler:
    enabled: true
  networkReconciler:
    enabled: true
  idleEvaluator:
    enabled: true
    dryRun: false
  contentFilter:
    enabled: false
