# Example production-shaped overlay for the selfservice Helm chart.
# Use for local helm lint/template and chart unit tests in this public repo.
#
# Real lab/production topology lives in the private crucible-deploy repo.
# Do not put real management FQDNs, datacenter names, or RFC1918 lab IPs here.
#
# Apply shape (private deploy):
#   helm upgrade selfservice . -n selfservice -f values.yaml -f <crucible-deploy overlay>
#
# In-repo validation:
#   helm template selfservice . -f values.yaml -f values.example.yaml

replicaCount:
  # Two workers with leader election + required hostname anti-affinity.
  worker: 2

provisioning:
  enabled: true
  workerClaimsEnabled: true

vcenter:
  # Placeholder host allowlist and pools. Replace from private crucible-deploy.
  hosts: "esxi1.example.test,esxi2.example.test,host3.example.test,host4.example.test,host5.example.test"
  resourcePools: "/Example-Datacenter/host/AMD-Cluster/Resources/Student-VMs,/Example-Datacenter/host/Intel-Cluster/Resources/Student-VMs"
  placementReservedMemoryMB: "esxi1.example.test=8192,esxi2.example.test=8192,host3.example.test=4096,host4.example.test=2048,host5.example.test=2048"
  insecure: "false"

synthetic:
  suspend: false
  schedule: "*/12 * * * *"
  provisioningExpectedEnabled: true
  lifecycle:
    enabled: true
    template: synthetic-noop
    # Pinned timeout numbers chart tests / budget guards assert against.
    # Worst case: 2×(150s+90s+60s)+30s = 630s = 10m30s.
    readyTimeout: 150s
    destroyTimeout: 90s
    maxAttempts: 2
    retryBackoff: 30s
  janitor:
    enabled: true
    suspend: false
  runner:
    enabled: true
    suspend: false
    schedule: "37 * * * *"
    activeDeadlineSeconds: 2700
    scheduleInterval: "1h"
    terminationGracePeriodSeconds: 60

worker:
  contentFilter:
    enabled: false
    categoryFeedBaseURL: ""
  l1Validation:
    enabled: true
    validationInterval: "168h"
    schedulerInterval: "5m"
  templateHealth:
    enabled: true
    interval: "12h"
    deepTimeout: "10m"
    confirmationBackoff: "5m"
    confirmationReconcileInterval: "1m"
  orphanReconciler:
    enabled: true
  templateOrphanReconciler:
    enabled: true
  networkReconciler:
    enabled: true
  idleEvaluator:
    enabled: true
    dryRun: false
  pipelineReconciler:
    enabled: true

postgresql:
  image:
    pullPolicy: IfNotPresent
    tag: latest

