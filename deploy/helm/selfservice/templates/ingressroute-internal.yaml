{{- if and .Values.ingress.enabled .Values.ingress.internalHostname (ne .Values.ingress.internalHostname .Values.ingress.hostname) }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-internal-host-redirect
spec:
  redirectRegex:
    regex: "^https?://{{ .Values.ingress.internalHostname }}(/.*)?$"
    replacement: "https://{{ .Values.ingress.hostname }}${1}"
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress-internal
  labels:
    app.kubernetes.io/name: selfservice
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ .Release.Name }}-internal-host-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.internalHostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-ui
                port:
                  number: 8080
  tls:
    - hosts:
        - {{ .Values.ingress.internalHostname }}
      secretName: selfservice-tls
{{- end }}
