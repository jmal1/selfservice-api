apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    app.kubernetes.io/name: selfservice-api
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/name: selfservice-api
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: selfservice-api
        app.kubernetes.io/component: api-gateway
      {{- if .Values.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-oidc: {{ .Values.vault.secretPaths.oidc | quote }}
        vault.hashicorp.com/agent-inject-secret-db: {{ .Values.vault.secretPaths.database | quote }}
        vault.hashicorp.com/agent-inject-secret-jwt: {{ .Values.vault.secretPaths.jwt | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["api-gateway"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: {{ .Values.api.port | quote }}
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              value: {{ .Values.database.user | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.database.sslmode | quote }}
            - name: OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: OIDC_REDIRECT_URL
              value: {{ .Values.oidc.redirectURL | quote }}
            - name: NATS_URL
              value: {{ .Values.natsURL | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
