apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-engine
  labels:
    app.kubernetes.io/name: selfservice-api
    app.kubernetes.io/component: crucible-engine
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-engine-runner
  labels:
    app.kubernetes.io/name: selfservice-api
    app.kubernetes.io/component: crucible-engine
rules:
  # Jobs: create runner jobs, list for cleanup, delete on completion
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  # Secrets: create runner configs, delete after completion
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete"]
  # Pods: list runner pods (for status checking), delete (for cancellation)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  # NetworkAttachmentDefinitions: create per-VLAN NADs
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-engine-runner
  labels:
    app.kubernetes.io/name: selfservice-api
    app.kubernetes.io/component: crucible-engine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-engine-runner
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-engine
    namespace: {{ .Release.Namespace }}
