# Path filters for the matrix in .github/workflows/ci.yaml.
#
# Each top-level key is a "channel" used by dorny/paths-filter@v3 to decide
# whether the corresponding matrix job has to run.
#
# The Kali assessment runner image is built in jmal1/selfservice-crucible-runner
# (not this matrix). Engine/gateway still import that Go module via go.mod;
# bumping the module version is a shared/go.mod change and rebuilds consumers.
#
# Source of truth for the per-component lists is `go list -deps ./cmd/<x>/`.

shared:
  - 'go.mod'
  - 'go.sum'
  - 'Dockerfile'
  - '.github/workflows/ci.yaml'
  - '.github/scripts/compute-image-matrix.sh'
  - '.github/path-filters.yaml'
  - 'internal/actionlibrary/**'
  - 'internal/config/**'
  - 'internal/database/**'
  - 'internal/models/**'
  - 'internal/nats/**'
  - 'internal/provisioning/**'
  - 'internal/workflowvalidation/**'

api-gateway:
  - 'cmd/api-gateway/**'
  - 'internal/api/**'
  - 'internal/audit/**'
  - 'internal/auth/**'
  - 'internal/docs/**'
  - 'internal/middleware/**'
  - 'internal/objectstore/**'
  - 'internal/opnsense/**'
  - 'internal/provisioner/**'
  - 'internal/provisioner/assets/**'
  - 'internal/rollback/**'
  - 'internal/scriptvalidator/**'
  - 'internal/templates/**'
  - 'internal/unattend/**'
  - 'internal/vcenter/**'
  - 'internal/vsphere/**'
  - 'internal/wikitypes/**'

provision-worker:
  - 'cmd/provision-worker/**'
  - 'internal/worklease/**'
  - 'internal/objectstore/**'
  - 'internal/opnsense/**'
  - 'internal/provisioner/**'
  - 'internal/rollback/**'
  - 'internal/templates/**'
  - 'internal/unattend/**'
  - 'internal/vcenter/**'

crucible-engine:
  - 'cmd/crucible-engine/**'
  - 'internal/engine/**'
  - 'internal/vcenter/**'

synthetic-api-monitor:
  - 'cmd/synthetic-api-monitor/**'
  - 'internal/audit/**'
  - 'internal/auth/**'
  - 'internal/objectstore/**'
  - 'internal/opnsense/**'
  - 'internal/provisioner/**'
  - 'internal/rollback/**'
  - 'internal/synthetic/**'
  - 'internal/templates/**'
  - 'internal/unattend/**'
  - 'internal/vcenter/**'

# Also drive whether the Go `test` job has to run. Any Go source change
# triggers it.
go-tests:
  - 'go.mod'
  - 'go.sum'
  - 'cmd/**'
  - 'internal/**'
  - 'deploy/scripts/**'
  # Production containment values have load-bearing Go guard tests.
  - 'deploy/helm/selfservice/**'
  - '.github/scripts/**'
  - '.github/path-filters.yaml'
  - '.github/workflows/ci.yaml'
