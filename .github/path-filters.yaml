# Path filters for the matrix in .github/workflows/ci.yaml.
#
# Each top-level key is a "channel" used by dorny/paths-filter@v3 to decide
# whether the corresponding matrix job has to run.
#
# Channels:
#   shared           — paths that affect every Alpine binary; presence in a PR/push
#                      forces the four Alpine matrix jobs. Kali (crucible-runner) is
#                      NOT included — it only rebuilds via its own channel (Crucible#51).
#   <component>      — paths whose changes only require that component to
#                      rebuild. Shared internal packages (e.g. internal/vcenter
#                      used by api-gateway + provision-worker + crucible-engine)
#                      are intentionally listed under EVERY consuming
#                      component so they trigger the right subset.
#
# Source of truth for the per-component lists is `go list -deps ./cmd/<x>/`.
# If you add a new internal package and a cmd that imports it, append it to
# the corresponding component channel (or to `shared` if 2+ components use
# it AND it changes often enough that listing it under each component would
# be noisy).

shared:
  - 'go.mod'
  - 'go.sum'
  - 'Dockerfile'
  - '.github/workflows/ci.yaml'
  - '.github/scripts/compute-image-matrix.sh'
  - '.github/path-filters.yaml'
  - 'internal/actionlibrary/**'
  - 'internal/config/**'
  - 'internal/database/**'
  - 'internal/models/**'
  - 'internal/nats/**'
  - 'internal/provisioning/**'
  - 'internal/workflowvalidation/**'

api-gateway:
  - 'cmd/api-gateway/**'
  - 'internal/api/**'
  - 'internal/audit/**'
  - 'internal/auth/**'
  - 'internal/docs/**'
  - 'internal/middleware/**'
  - 'internal/objectstore/**'
  - 'internal/opnsense/**'
  - 'internal/provisioner/**'
  - 'internal/provisioner/assets/**'
  - 'internal/rollback/**'
  - 'internal/runnertools/**'
  - 'internal/scriptvalidator/**'
  - 'internal/templates/**'
  - 'internal/unattend/**'
  - 'internal/vcenter/**'
  - 'internal/vsphere/**'
  - 'internal/wikitypes/**'

provision-worker:
  - 'cmd/provision-worker/**'
  - 'internal/worklease/**'
  - 'internal/objectstore/**'
  - 'internal/opnsense/**'
  - 'internal/provisioner/**'
  - 'internal/rollback/**'
  - 'internal/templates/**'
  - 'internal/unattend/**'
  - 'internal/vcenter/**'

crucible-engine:
  - 'cmd/crucible-engine/**'
  - 'internal/engine/**'
  - 'internal/runner/**'
  - 'internal/vcenter/**'

synthetic-api-monitor:
  - 'cmd/synthetic-api-monitor/**'
  - 'internal/audit/**'
  - 'internal/auth/**'
  - 'internal/objectstore/**'
  - 'internal/opnsense/**'
  - 'internal/provisioner/**'
  - 'internal/rollback/**'
  - 'internal/synthetic/**'
  - 'internal/templates/**'
  - 'internal/unattend/**'
  - 'internal/vcenter/**'

crucible-runner:
  # deploy/runner/Dockerfile does NOT just package a bash library: its builder
  # stage runs `go build ./cmd/crucible-runner/`. Listing only deploy/runner/**
  # here meant a change to the runner's Go code did not rebuild the runner
  # image, so the next deploy silently shipped a stale runner binary while
  # every other component picked the change up. See TestPathFilters_*.
  # go.mod/go.sum must stay here: shared no longer forces Kali (Crucible#51),
  # but the builder stage still compiles against the module graph.
  - 'go.mod'
  - 'go.sum'
  - 'deploy/runner/**'
  - 'cmd/crucible-runner/**'
  - 'internal/runner/**'
  # internal/runnertools is NOT a Go dependency of cmd/crucible-runner -- the
  # Dockerfile COPYs internal/runnertools/tools.txt and derives both the apt
  # install list and the verification loop from it. TestPathFilters_* walks the
  # Go import graph and therefore cannot see this edge, so it is listed by hand.
  # Without it, adding a tool to the manifest would not rebuild the image that
  # is supposed to contain the tool.
  - 'internal/runnertools/**'

# Also drive whether the Go `test` job has to run. Any Go source change
# triggers it; deploy/runner-only changes (which only contain a Dockerfile
# and bash scripts) do not.
go-tests:
  - 'go.mod'
  - 'go.sum'
  - 'cmd/**'
  - 'internal/**'
  - 'deploy/scripts/**'
  # Production containment values have load-bearing Go guard tests.
  - 'deploy/helm/selfservice/**'
  - '.github/scripts/**'
  - '.github/path-filters.yaml'
  - '.github/workflows/ci.yaml'

