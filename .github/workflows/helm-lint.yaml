name: Helm Lint

on:
  pull_request:
    paths:
      - 'deploy/helm/**'
      - '.github/workflows/helm-lint.yaml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.20.0'

      - name: Add chart repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/

      - name: helm dependency build
        working-directory: deploy/helm/selfservice
        run: helm dep build

      # Lint catches schema-level chart errors.
      - name: helm lint (defaults)
        working-directory: deploy/helm/selfservice
        run: helm lint . -f values.yaml

      - name: helm lint (defaults + prod overrides)
        working-directory: deploy/helm/selfservice
        run: helm lint . -f values.yaml -f values.prod.yaml

      # Template catches missing required values that lint won't (the bug from
      # 2026-06-09 night when `synthetic.janitor.schedule` was added to
      # values.yaml without `--reset-then-reuse-values` would have been caught
      # here).
      - name: helm template (defaults + prod overrides)
        working-directory: deploy/helm/selfservice
        run: helm template selfservice . -f values.yaml -f values.prod.yaml > rendered-prod.yaml

      # Guards the 2026-08-25 dry-run failure: deploy.sh's
      # validate_foundation_intent requires SYNTHETIC_LIFECYCLE_ENABLED to
      # render EXACTLY ONCE with an explicit boolean. Wrapping it in the
      # synthetic.lifecycle.enabled conditional makes it disappear entirely,
      # which `helm template ... > /dev/null` alone does not catch.
      - name: assert SYNTHETIC_LIFECYCLE_ENABLED=false in prod render
        working-directory: deploy/helm/selfservice
        run: |
          set -euo pipefail
          count=$(grep -c '^\s*- name: SYNTHETIC_LIFECYCLE_ENABLED$' rendered-prod.yaml)
          if [ "$count" -ne 1 ]; then
            echo "ERROR: prod render has SYNTHETIC_LIFECYCLE_ENABLED $count times, want exactly 1" >&2
            exit 1
          fi
          value=$(grep -A1 '^\s*- name: SYNTHETIC_LIFECYCLE_ENABLED$' rendered-prod.yaml | tail -1)
          if ! echo "$value" | grep -qx '\s*value: "false"'; then
            echo "ERROR: prod render's SYNTHETIC_LIFECYCLE_ENABLED is not explicit false: $value" >&2
            exit 1
          fi

      - name: helm lint and template (approved full-fleet overlay)
        working-directory: deploy/helm/selfservice
        run: |
          helm lint . -f values.yaml -f values.full-fleet.yaml
          helm template selfservice . -f values.yaml -f values.full-fleet.yaml > rendered-full-fleet.yaml

      - name: assert SYNTHETIC_LIFECYCLE_ENABLED=true in full-fleet render
        working-directory: deploy/helm/selfservice
        run: |
          set -euo pipefail
          count=$(grep -c '^\s*- name: SYNTHETIC_LIFECYCLE_ENABLED$' rendered-full-fleet.yaml)
          if [ "$count" -ne 1 ]; then
            echo "ERROR: full-fleet render has SYNTHETIC_LIFECYCLE_ENABLED $count times, want exactly 1" >&2
            exit 1
          fi
          value=$(grep -A1 '^\s*- name: SYNTHETIC_LIFECYCLE_ENABLED$' rendered-full-fleet.yaml | tail -1)
          if ! echo "$value" | grep -qx '\s*value: "true"'; then
            echo "ERROR: full-fleet render's SYNTHETIC_LIFECYCLE_ENABLED is not explicit true: $value" >&2
            exit 1
          fi
