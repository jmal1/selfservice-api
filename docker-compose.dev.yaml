# Local development stack for selfservice-api.
#
# Brings up the bare minimum infra (Postgres + NATS) so you can run
# 'go run ./cmd/api-gateway' (or any other cmd) locally without touching
# the K3s cluster. vCenter, OPNsense, and OIDC are NOT mocked here -
# any code path that touches them needs a stub or VPN access to prod.
#
# Usage:
#   docker compose -f docker-compose.dev.yaml up -d
#   export DB_HOST=localhost DB_PASSWORD=dev DB_NAME=selfservice DB_USER=selfservice
#   export NATS_URL=nats://localhost:4222
#   export OIDC_ISSUER_URL=https://authentik.jmal.io/application/o/selfservice/  # if you want real OIDC
#   go run ./cmd/api-gateway
#
# Tear down (drops data):
#   docker compose -f docker-compose.dev.yaml down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: selfservice-dev-postgres
    environment:
      POSTGRES_USER: selfservice
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: selfservice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfservice -d selfservice"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    container_name: selfservice-dev-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional: a local pushgateway so synthetic-api-monitor has somewhere
  # to push during 'go run ./cmd/synthetic-api-monitor'. Uncomment if needed.
  # pushgateway:
  #   image: prom/pushgateway:v1.10.0
  #   container_name: selfservice-dev-pushgateway
  #   ports:
  #     - "9091:9091"

volumes:
  pgdata:
